{% extends "layout.html" %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <h1>Вхід</h1>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <input type="text" id="username" placeholder="Логін">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Пароль">
            </div>

            <button type="submit">Увійти</button>
        </form>

        <p>Ще не маєте акаунту? <a href="{% url 'register' %}">Зареєструватися</a></p>

        <div id="error-message" class="auth-error-box"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    const MAIN_PAGE_URL = "{% url 'main_page' %}";
</script>

<script src="{% static 'js/login.js' %}?v=2.0"></script>
{% endblock %}
