{% extends "layout.html" %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <h1>Реєстрація</h1>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <input type="text" id="username" placeholder="Логін">
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Електронна адреса">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Пароль">
            </div>
            <div class="form-group">
                <input type="password" id="password_check" placeholder="Перевірка паролю">
            </div>
            <button type="submit">Зареєструватися</button>
        </form>

        <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>

        <div id="error-message" class="auth-error-box"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    const MAIN_PAGE_URL = "{% url 'main_page' %}";
</script>

<script src="{% static 'js/register.js' %}?v=2.0"></script>
{% endblock %}
