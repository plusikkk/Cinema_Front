{% extends "layout.html" %}
{% load static %}

{% block content %}
<div class="auth-container">
    <h1>Реєстрація</h1>

    <form id="registerForm">
        <div class="form-group">
            <input type="text" id="username" placeholder="Логін" required>
        </div>
        <div class="form-group">
            <input type="email" id="email" placeholder="Електронна адреса" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Пароль" required>
        </div>
        <div class="form-group">
            <input type="password" id="password_check" placeholder="Перевірка паролю" required>
        </div>
        <button type="submit">Зарєструватися</button>
    </form>

    <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>


    <div id="error-message" style="color: red; display: none; margin-top: 10px;"></div>
</div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        const MAIN_PAGE_URL = "{% url 'main_page' %}";
    </script>

    <script src="{% static 'js/register.js' %}"></script>
{% endblock %}
